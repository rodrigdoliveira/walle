[package]
name = "walle-tracking"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust carrier scrapers for the Walle personal package tracker"

[lib]
name = "walle_tracking"
path = "src/lib.rs"

[[bin]]
name = "tracking-probe"
path = "src/bin/tracking_probe.rs"

[dependencies]
async-trait = "0.1.89"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "cookies", "gzip", "json", "query", "rustls", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6.5"
